name: epoll-server CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_ci: ${{ steps.detect.outputs.run_ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changes outside README files
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Run CI conservatively for new branches without a before SHA.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Compare the full PR diff from the common ancestor.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          fi

          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- . \
            ':(exclude)README.md' ':(exclude)README_ja.md'; then
            echo "run_ci=false" >> "$GITHUB_OUTPUT"
          else
            diff_status=$?
            if [[ "$diff_status" -ne 1 ]]; then
              exit "$diff_status"
            fi
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: make

      - name: Check build output
        run: ls -lh build/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: epoll-server
          path: build/server
          if-no-files-found: error

  sanitize:
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build with Sanitizers
        run: make sanitize

      - name: Run sanitizer test
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail

          ./build/server-sanitize > server.log 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" > server.pid

          cleanup() {
            test_status=$?
            trap - EXIT
            set +e

            # Request graceful shutdown
            kill -TERM "$SERVER_PID" 2>/dev/null || true

            # Collect server exit status
            wait "$SERVER_PID"
            server_status=$?

            echo "=== Server log ==="
            cat server.log

            if [ "$server_status" -ne 0 ]; then
              echo "::error::Server exited with status $server_status"
              exit 1
            fi

            exit "$test_status"
          }

          trap cleanup EXIT

          # Wait for server readiness
          ready=0
          for i in {1..20}; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server terminated unexpectedly"
              cat server.log
              exit 1
            fi

            if (true > /dev/tcp/127.0.0.1/8080) 2>/dev/null; then
              ready=1 
              break
            fi

            sleep 0.5
          done

          if [ "$ready" -ne 1 ]; then
            echo "Server readiness timeout"
            exit 1
          fi

          echo "Server is ready"

          # Execute load test
          python3 tests/load_test.py

  test:
    needs: [changes, build]
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: epoll-server
          path: build/

      - name: Restore executable permission
        run: chmod +x build/server

      - name: Load test
        run: bash tests/run_test.sh tests/load_test.py

      - name: Backpressure recovery test
        run: bash tests/run_test.sh tests/backpressure_recovery_test.py
 
      - name: Slow client test
        run: bash tests/run_test.sh tests/slow_client_test.py

      - name: Protocol test
        run: bash tests/run_test.sh tests/protocol_test.py

      - name: Idle timeout test
        run: bash tests/run_test.sh tests/idle_timeout_test.py

  docker-build:
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t epoll-server:ci .

  publish:
    needs: [changes, build, test, sanitize, docker-build]
    if: needs.changes.outputs.run_ci == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.push.outputs.digest }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    concurrency:
      group: epoll-production-deploy
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.72.72.20

      - name: Setup SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          FEDORA_SSH_HOST_KEY: ${{ secrets.FEDORA_SSH_HOST_KEY }}
        run: |
          set -euo pipefail

          install -d -m 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" \
            > ~/.ssh/epoll_cd_ed25519
          chmod 600 ~/.ssh/epoll_cd_ed25519

          read -r key_type key_data _ <<< "$FEDORA_SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          test -n "$key_data"

          printf '100.72.72.20 %s %s\n' \
            "$key_type" "$key_data" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to Fedora
        shell: bash
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/epoll_cd_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            epolldeploy@100.72.72.20 \
            bash -s -- "$IMAGE_REF" < scripts/deploy.sh

