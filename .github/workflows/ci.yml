name: epoll-server CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Check build output
        run: ls -lh build/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: epoll-server
          path: build/server
          if-no-files-found: error

  test:
  needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: epoll-server
          path: build/

