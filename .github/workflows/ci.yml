name: epoll-server CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Check build output
        run: ls -lh build/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: epoll-server
          path: build/server
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: epoll-server
          path: build/

      - name: Start server
        run: |
          chmod +x build/server
          ./build/server > server.log 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" > server.pid

          for i in {1..20}; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server terminated unexpectedly"
              cat server.log
              exit 1
            fi

            if (true > /dev/tcp/127.0.0.1/8080) 2>/dev/null; then
              echo "Server is ready"
              exit 0
            fi

            sleep 0.5
          done

          echo "Server readiness timeout"
          cat server.log
          exit 1

      - name: Run load test
        run: |
          python3 tests/load_test.py

      - name: Step server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi

      - name: Print server log
        if: always()
        run: cat server.log || true
