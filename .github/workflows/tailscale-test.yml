name: Tailscale Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tailscale-test:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Check Tailscale connection
        run: |
          tailscale status
          tailscale ping --until-direct=false --c=1 --timeout=10s 100.72.72.20

      - name: Check Fedora SSH port
        run: |
          timeout 10 bash -c \
            'echo > /dev/tcp/100.72.72.20/22'
          echo "Fedora SSH port is reachable"

      - name: Test SSH authentication
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          FEDORA_SSH_HOST_KEY: ${{ secrets.FEDORA_SSH_HOST_KEY }}
        run: |
          set -euo pipefail

          install -d -m 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/epoll_cd_ed25519
          chmod 600 ~/.ssh/epoll_cd_ed25519

          # SSH秘密鍵の形式を検証
          ssh-keygen -y -f ~/.ssh/epoll_cd_ed25519 > /dev/null

          # 信頼済みのFedoraホスト鍵を登録
          read -r key_type key_data _ <<< "$FEDORA_SSH_HOST_KEY"
          printf '100.72.72.20 %s %s\n' \
            "$key_type" "$key_data" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Fedoraへ実際にSSH接続
          ssh -i ~/.ssh/epoll_cd_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            epolldeploy@100.72.72.20 \
            'whoami && systemctl --user is-active epoll-server.service'

